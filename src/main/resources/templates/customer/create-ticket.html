<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Create Ticket | SupportDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container page-container">

    <!-- Page Header -->
    <div class="mb-4">
        <h2 class="page-title">Create Support Ticket</h2>

        <p class="page-subtitle">
            Describe your issue and our support team will help you.
        </p>
    </div>


    <!-- Ticket Form -->
    <div class="card custom-card">

        <div class="card-body p-4 p-md-5">

            <form th:action="@{/customer/tickets}"
                  method="post">

                <!-- Title -->
                <div class="mb-4">

                    <label for="title"
                           class="form-label fw-semibold">
                        Ticket Title
                    </label>

                    <input type="text"
                           class="form-control"
                           id="title"
                           name="title"
                           placeholder="Enter a short description of your issue"
                           maxlength="200"
                           required>

                    <div class="form-text">
                        Keep the title short and clear.
                    </div>

                </div>


                <!-- Description -->
                <div class="mb-4">

                    <label for="description"
                           class="form-label fw-semibold">
                        Description
                    </label>

                    <textarea class="form-control"
                              id="description"
                              name="description"
                              rows="7"
                              placeholder="Describe your issue in detail..."
                              required></textarea>

                    <div class="form-text">
                        Provide as much information as possible so we can resolve your issue faster.
                    </div>

                </div>


                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/customer/dashboard}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-primary">
                        Create Ticket
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
