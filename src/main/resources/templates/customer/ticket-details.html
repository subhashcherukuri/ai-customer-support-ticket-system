<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Ticket Details | SupportDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container page-container">

    <!-- Back -->
    <div class="mb-3">
        <a th:href="@{/customer/tickets}"
           class="text-primary">
            ← Back to My Tickets
        </a>
    </div>


    <!-- Ticket Header -->
    <div class="card custom-card mb-4">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-start">

                <div>

                    <p class="text-muted mb-1">
                        Ticket #<span th:text="${ticket.id}">1</span>
                    </p>

                    <h2 class="fw-bold mb-2"
                        th:text="${ticket.title}">
                        Payment issue
                    </h2>

                </div>

                <span class="status-badge bg-primary-subtle text-primary"
                      th:text="${ticket.status}">
                    OPEN
                </span>

            </div>

            <hr>

            <p class="text-muted mb-0"
               th:text="${ticket.description}">
                Ticket description
            </p>

        </div>

    </div>


    <!-- Conversation -->

    <div class="card custom-card mb-4">

        <div class="card-body p-4">

            <h5 class="fw-bold mb-4">
                Conversation
            </h5>


            <!-- Messages -->

            <div th:each="message : ${messages}"
                 class="border-bottom pb-3 mb-3">

                <div class="d-flex justify-content-between">

                    <strong th:text="${message.senderName}">
                        User
                    </strong>

                    <small class="text-muted"
                           th:text="${message.createdAt}">
                        Date
                    </small>

                </div>

                <p class="mb-0 mt-2 text-muted"
                   th:text="${message.message}">
                    Message
                </p>

            </div>


            <!-- No Messages -->

            <div th:if="${#lists.isEmpty(messages)}"
                 class="text-center py-4">

                <p class="text-muted mb-0">
                    No messages yet.
                </p>

            </div>

        </div>

    </div>


    <!-- Reply -->

    <div class="card custom-card"
         th:if="${ticket.status != T(com.example.support.enums.TicketStatus).CLOSED}">

        <div class="card-body p-4">

            <h5 class="fw-bold mb-3">
                Send Message
            </h5>

            <form th:action="@{/customer/tickets/{id}/messages(id=${ticket.id})}"
                  method="post">

                <div class="mb-3">

                    <textarea name="message"
                              class="form-control"
                              rows="4"
                              placeholder="Write your message..."
                              required></textarea>

                </div>

                <div class="text-end">

                    <button type="submit"
                            class="btn btn-primary">
                        Send Message
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
