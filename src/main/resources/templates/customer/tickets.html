<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Tickets | SupportDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container page-container">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="page-title">My Tickets</h2>
                <p class="page-subtitle mb-0">
                    View and track your support tickets
                </p>
            </div>

            <a th:href="@{/customer/dashboard}"
               class="btn btn-outline-primary">
                ← Back to Dashboard
            </a>

        </div>

        <a th:href="@{/customer/tickets/create}"
           class="btn btn-primary">
            + Create Ticket
        </a>

    </div>


    <!-- Tickets -->
    <div class="card custom-card">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead class="table-light">

                    <tr>
                        <th class="px-4">ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th class="text-end px-4">Action</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="ticket : ${tickets}">

                        <td class="px-4"
                            th:text="${ticket.id}">
                            1
                        </td>

                        <td>
                            <span class="fw-semibold"
                                  th:text="${ticket.title}">
                                Payment issue
                            </span>
                        </td>

                        <td>
                            <span th:text="${ticket.category != null ? ticket.category : 'Pending'}">
                                PAYMENT
                            </span>
                        </td>

                        <td>
                            <span th:text="${ticket.priority != null ? ticket.priority : 'Pending'}">
                                HIGH
                            </span>
                        </td>

                        <td>
                            <span class="status-badge bg-primary-subtle text-primary"
                                  th:text="${ticket.status}">
                                OPEN
                            </span>
                        </td>

                        <td>
                            <span class="text-muted">
                                View details
                            </span>
                        </td>

                        <td class="text-end px-4">

                            <a th:href="@{/customer/tickets/{id}(id=${ticket.id})}"
                               class="btn btn-sm btn-outline-primary">
                                View
                            </a>

                        </td>

                    </tr>


                    <!-- Empty state -->

                    <tr th:if="${#lists.isEmpty(tickets)}">

                        <td colspan="7"
                            class="text-center py-5">

                            <h5 class="fw-semibold">
                                No tickets found
                            </h5>

                            <p class="text-muted mb-3">
                                You haven't created any support tickets yet.
                            </p>

                            <a th:href="@{/customer/tickets/create}"
                               class="btn btn-primary">
                                Create Your First Ticket
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
