<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Customer Dashboard | SupportDesk</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container page-container">

    <!-- Header -->

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <div>

            <h2 class="page-title">
                Customer Dashboard
            </h2>

            <p class="page-subtitle mb-0">
                Welcome back,
                <span th:text="${loggedInUser.name}">
                    Customer
                </span>
            </p>

        </div>

        <a th:href="@{/customer/tickets/create}"
           class="btn btn-primary">

            + Create Ticket

        </a>

    </div>


    <!-- Statistics -->

    <div class="row g-4 mb-4">

        <div class="col-md-3">

            <div class="card custom-card h-100">

                <div class="card-body">

                    <p class="text-muted mb-2">
                        Total Tickets
                    </p>

                    <h3 class="fw-bold"
                        th:text="${#lists.size(tickets)}">
                        0
                    </h3>

                </div>

            </div>

        </div>


        <div class="col-md-3">

            <div class="card custom-card h-100">

                <div class="card-body">

                    <p class="text-muted mb-2">
                        Open
                    </p>

                    <h3 class="fw-bold text-primary"
                        th:text="${#lists.size(tickets.?[status.name() == 'OPEN'])}">
                        0
                    </h3>

                </div>

            </div>

        </div>


        <div class="col-md-3">

            <div class="card custom-card h-100">

                <div class="card-body">

                    <p class="text-muted mb-2">
                        In Progress
                    </p>

                    <h3 class="fw-bold text-warning"
                        th:text="${#lists.size(tickets.?[status.name() == 'IN_PROGRESS'])}">
                        0
                    </h3>

                </div>

            </div>

        </div>


        <div class="col-md-3">

            <div class="card custom-card h-100">

                <div class="card-body">

                    <p class="text-muted mb-2">
                        Resolved
                    </p>

                    <h3 class="fw-bold text-success"
                        th:text="${#lists.size(tickets.?[status.name() == 'RESOLVED'])}">
                        0
                    </h3>

                </div>

            </div>

        </div>

    </div>


    <!-- Recent Tickets -->

    <div class="card custom-card">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between
                        align-items-center mb-3">

                <h5 class="fw-bold mb-0">
                    My Recent Tickets
                </h5>

                <a th:href="@{/customer/tickets}"
                   class="text-primary">
                    View All
                </a>

            </div>


            <!-- No Tickets -->

            <div th:if="${#lists.isEmpty(tickets)}"
                 class="text-center py-5">

                <h5 class="text-muted">
                    No tickets yet
                </h5>

                <p class="text-muted">
                    Create your first support ticket to get started.
                </p>

                <a th:href="@{/customer/tickets/create}"
                   class="btn btn-primary">
                    Create Ticket
                </a>

            </div>


            <!-- Tickets Table -->

            <div th:unless="${#lists.isEmpty(tickets)}"
                 class="table-responsive">

                <table class="table">

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Action</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="ticket : ${tickets}">

                        <td th:text="${ticket.id}">
                            1
                        </td>

                        <td>

                            <span class="fw-semibold"
                                  th:text="${ticket.title}">
                                Payment issue
                            </span>

                        </td>

                        <td>

                            <span class="status-badge bg-primary-subtle text-primary"
                                  th:text="${ticket.status}">
                                OPEN
                            </span>

                        </td>

                        <td th:text="${ticket.priority}">
                            HIGH
                        </td>

                        <td>

                            <a th:href="@{'/customer/tickets/' + ${ticket.id}}"
                               class="btn btn-sm btn-outline-primary">
                                View
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
