<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>All Tickets - SupportDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container page-container">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="page-title">All Tickets</h2>
            <p class="page-subtitle mb-0">
                View and manage all customer support tickets
            </p>
        </div>

        <a th:href="@{/admin/dashboard}"
           class="btn btn-outline-primary">
            ← Back to Dashboard
        </a>

    </div>


    <div class="card custom-card">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Sentiment</th>
                        <th>Assigned Agent</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="ticket : ${tickets}">

                        <td th:text="${ticket.id}">
                            1
                        </td>

                        <td>
                            <strong th:text="${ticket.title}">
                                Payment issue
                            </strong>
                        </td>

                        <td th:text="${ticket.category}">
                            PAYMENT
                        </td>

                        <td th:text="${ticket.priority}">
                            HIGH
                        </td>

                        <td>

                            <span class="status-badge bg-light text-dark"
                                  th:text="${ticket.status}">
                                OPEN
                            </span>

                        </td>

                        <td th:text="${ticket.sentiment}">
                            NEGATIVE
                        </td>

                        <td>
                            <span th:if="${ticket.assignedAgentName != null}"
                            th:text="${ticket.assignedAgentName}">
                                 Agent
                            </span>

                            <span th:if="${ticket.assignedAgentName == null}"
                                  class="text-muted">
                                  Unassigned
                             </span>
                        </td>
                        <td>

                            <a th:href="@{/admin/tickets/{id}(id=${ticket.id})}"
                               class="btn btn-sm btn-outline-primary">
                                View
                            </a>

                        </td>

                    </tr>

                    <tr th:if="${tickets.isEmpty()}">

                        <td colspan="7"
                            class="text-center text-muted py-4">

                            No tickets found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
