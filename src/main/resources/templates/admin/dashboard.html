<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Admin Dashboard - SupportDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container page-container">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="page-title">Admin Dashboard</h2>
            <p class="page-subtitle mb-0">
                Manage tickets, agents and support operations
            </p>
        </div>


    </div>


    <!-- Statistics -->

    <div class="row g-4 mb-4">

        <div class="col-md-3">

            <div class="card custom-card dashboard-stat">
                <div class="card-body">

                    <p class="text-muted mb-2">
                        Total Tickets
                    </p>

                    <h3 class="fw-bold"
                        th:text="${totalTickets}">
                        0
                    </h3>

                </div>
            </div>

        </div>


        <div class="col-md-3">

            <div class="card custom-card dashboard-stat">
                <div class="card-body">

                    <p class="text-muted mb-2">
                        Open
                    </p>

                    <h3 class="fw-bold"
                        th:text="${openTickets}">
                        0
                    </h3>

                </div>
            </div>

        </div>


        <div class="col-md-3">

            <div class="card custom-card dashboard-stat">
                <div class="card-body">

                    <p class="text-muted mb-2">
                        In Progress
                    </p>

                    <h3 class="fw-bold"
                        th:text="${inProgressTickets}">
                        0
                    </h3>

                </div>
            </div>

        </div>


        <div class="col-md-3">

            <div class="card custom-card dashboard-stat">
                <div class="card-body">

                    <p class="text-muted mb-2">
                        Resolved
                    </p>

                    <h3 class="fw-bold"
                        th:text="${resolvedTickets}">
                        0
                    </h3>

                </div>
            </div>

        </div>

        <div class="col-md-6 col-xl-3">
            <div class="card custom-card dashboard-stat p-4">
                <div class="text-muted mb-2">
                    Closed Tickets
                </div>

                <h2 class="fw-bold mb-0"
                    th:text="${closedTickets}">
                    0
                </h2>
            </div>
        </div>

    </div>


    <!-- Quick Actions -->

    <div class="row g-4">

        <div class="col-md-6">

            <div class="card custom-card">

                <div class="card-body">

                    <h5 class="fw-bold">
                        Ticket Management
                    </h5>

                    <p class="text-muted">
                        View and manage all customer support tickets.
                    </p>

                    <a th:href="@{/admin/tickets}"
                       class="btn btn-outline-primary">
                        View All Tickets
                    </a>

                </div>

            </div>

        </div>


        <div class="col-md-6">

            <div class="card custom-card">

                <div class="card-body">

                    <h5 class="fw-bold">
                        Agent Management
                    </h5>

                    <p class="text-muted">
                        Create and manage support agents.
                    </p>

                    <a th:href="@{/admin/agents}"
                       class="btn btn-outline-primary">
                        Manage Agents
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
