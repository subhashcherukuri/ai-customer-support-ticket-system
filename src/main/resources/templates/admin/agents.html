<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Manage Agents - SupportDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container page-container">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="page-title">Manage Agents</h2>
            <p class="page-subtitle mb-0">
                Create and manage support agents
            </p>
        </div>

        <a th:href="@{/admin/dashboard}"
           class="btn btn-outline-primary">
            ← Back to Dashboard
        </a>

    </div>

    <!-- Alerts -->
    <div th:if="${success}"
         class="alert alert-success"
         th:text="${success}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <div class="row g-4">

        <!-- Create Agent -->
        <div class="col-lg-5">

            <div class="card custom-card p-4">

                <h5 class="mb-3">Create New Agent</h5>

                <form th:action="@{/admin/agents}"
                      th:object="${agentRequest}"
                      method="post">

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               placeholder="Enter agent name">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Enter agent email">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               th:field="*{password}"
                               class="form-control"
                               placeholder="Enter password">

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Create Agent
                    </button>

                </form>

            </div>

        </div>


        <!-- Agent List -->
        <div class="col-lg-7">

            <div class="card custom-card p-4">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h5 class="mb-0">
                        Existing Agents
                    </h5>

                    <span class="badge bg-primary"
                          th:text="${#lists.size(agents)}">
                        0
                    </span>

                </div>

                <div class="table-responsive">

                    <table class="table">

                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="agent : ${agents}">

                            <td th:text="${agent.name}">
                                Agent Name
                            </td>

                            <td th:text="${agent.email}">
                                agent@email.com
                            </td>

                            <td>
                                <span class="badge bg-success"
                                      th:text="${agent.role}">
                                    AGENT
                                </span>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(agents)}">

                            <td colspan="3"
                                class="text-center text-muted py-4">
                                No agents found.
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
